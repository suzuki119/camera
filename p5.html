<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>カメラ（p5.js）</title>
    <style>
        html, body { margin: 0; overflow: hidden; background: #000; }
    </style>
    <!-- p5.js 2.x は preload が無く ml5 の読み込み方と合わないので 1.x に固定 -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1.4.0/dist/ml5.min.js"></script>
</head>

<body>
    <script>
        // 判定のゆるさ（数値を大きくするほどゆるい）
        const INDEX_BEND = 90;       // 人差し指の曲がりの許容（度）
        const THUMB_BEND = 120;      // 親指の曲がりの許容（度）
        const GUN_ANGLE = [30, 160]; // 構えとみなす親指と人差し指の角度（度）
        const THUMB_IN = 0.9;        // 親指を倒したとみなす距離（手のひらの長さに対する割合）
        const DISARM_GRACE = 500;    // 形が崩れても構えを保つ時間（ms）

        // 対戦のルール
        const MAX_HP = 100;
        const DAMAGE = 20;           // 1発のダメージ（5発で倒れる）
        const HIT_PAD = 20;          // 手の当たり判定を広げる量（映像のピクセル）
        const COOLDOWN = 250;        // ms
        const COLORS = ['#FF4D4D', '#4DA6FF'];

        let video, handPose;
        let hands = [];              // { h, side }（side: 0 = P1 / 1 = P2）
        let players, bullets, effects, winner;

        function preload() {
            handPose = ml5.handPose({ maxHands: 2, flipped: true });
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            angleMode(DEGREES);
            textStyle(BOLD);
            video = createCapture({ video: { width: 1280, height: 720 }, audio: false }, { flipped: true });
            video.hide();
            handPose.detectStart(video, gotHands);
            resetGame();
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); }

        function mousePressed() { if (winner) resetGame(); }

        function resetGame() {
            players = [0, 1].map(() => ({ hp: MAX_HP, armed: false, lastShot: 0, lastGrip: 0 }));
            bullets = [];
            effects = [];
            winner = null;
        }

        // 手の形を判定する（keypoints3D はメートル単位の3D座標なので、手の向きや距離に左右されにくい）
        //   gun:    L字（親指と人差し指を立て、その間が開いている）
        //   hammer: 人差し指は立てたまま、親指を人差し指側に倒した状態
        function judgePose(h) {
            const p = h.keypoints3D.map(k => createVector(k.x, k.y, k.z));
            const d = (a, b) => p5.Vector.dist(p[a], p[b]);
            // angleBetween は外積の向きでマイナスになる（手の向きで符号が変わる）ので絶対値にする
            const ang = (a, b, c, e) => abs(p5.Vector.sub(p[b], p[a]).angleBetween(p5.Vector.sub(p[e], p[c])));
            const bend = (a, b, c) => ang(a, b, b, c);                  // 関節 b での曲がり
            const folded = (pip, tip) => d(tip, 0) < d(pip, 0) * 1.15;  // 指先が第2関節と同じくらいか、より手首に近い

            const palm = d(0, 9);
            const indexUp = bend(5, 6, 8) < INDEX_BEND && d(8, 0) > d(6, 0);
            // 中指・薬指・小指は3本中2本折れていればよい
            const grip = indexUp && [folded(10, 12), folded(14, 16), folded(18, 20)].filter(Boolean).length >= 2;
            const a = ang(2, 4, 5, 8);
            const thumbTip = min(d(4, 5), d(4, 6));
            const thumbOut = bend(2, 3, 4) < THUMB_BEND && thumbTip > palm * 0.4;
            const thumbIn = thumbTip < palm * THUMB_IN || a < GUN_ANGLE[0];
            const gun = grip && thumbOut && a > GUN_ANGLE[0] && a < GUN_ANGLE[1];
            // 発射時は人差し指さえ立っていればよい（撃つ瞬間に他の指が動いても可）
            return { grip, gun, hammer: indexUp && thumbIn && !gun };
        }

        // 検出結果が届くたびに、構え→発射の状態を進める
        function gotHands(results) {
            const now = millis();
            hands = [];
            for (const h of results) {
                const side = h.middle_finger_mcp.x < video.elt.videoWidth / 2 ? 0 : 1; // 画面の左半分が P1
                if (hands.some(v => v.side === side)) continue;                        // 同じ側の2本目の手は無視
                hands.push({ h, side });

                const s = players[side];
                const pose = judgePose(h);
                if (pose.grip || pose.gun) s.lastGrip = now;

                if (pose.gun) {
                    s.armed = true;                         // 構えた
                } else if (s.armed && pose.hammer && now - s.lastShot > COOLDOWN) {
                    if (!winner) fire(h, side);             // 親指を閉じた → 発射
                    s.armed = false;
                    s.lastShot = now;
                } else if (now - s.lastGrip > DISARM_GRACE) {
                    s.armed = false;                        // 銃の形がしばらく崩れたら解除
                }
            }
            // 見えなくなった手も、少しの間は構えを保つ
            players.forEach((s, i) => {
                if (!hands.some(v => v.side === i) && now - s.lastGrip > DISARM_GRACE) s.armed = false;
            });
        }

        function fire(h, owner) {
            // 人差し指の付け根→指先の向きに飛ばす
            const pos = createVector(h.index_finger_tip.x, h.index_finger_tip.y);
            const vel = p5.Vector.sub(pos, createVector(h.index_finger_mcp.x, h.index_finger_mcp.y));
            if (vel.mag() === 0) vel.set(0, -1);
            vel.setMag(video.elt.videoWidth * 2.4);    // ピクセル/秒（映像の幅に合わせる）
            bullets.push({ pos, vel, owner });
            effects.push({ type: 'flash', pos: pos.copy(), t: millis() });
        }

        function damage(side, pos) {
            const pl = players[side];
            pl.hp = max(0, pl.hp - DAMAGE);
            effects.push({ type: 'hit', pos: pos.copy(), t: millis() });
            if (pl.hp === 0) winner = `P${2 - side} の勝ち！`;
        }

        // 手の周り（HIT_PAD だけ広げた四角形）に入ったか
        function inHand(h, pos) {
            const xs = h.keypoints.map(k => k.x), ys = h.keypoints.map(k => k.y);
            return pos.x > min(xs) - HIT_PAD && pos.x < max(xs) + HIT_PAD &&
                pos.y > min(ys) - HIT_PAD && pos.y < max(ys) + HIT_PAD;
        }

        function label(txt, x, y, c) {
            textSize(32);
            textAlign(CENTER, BASELINE);
            stroke(0);
            strokeWeight(5);
            fill(c);
            text(txt, x, y);
        }

        function draw() {
            background(0);
            const vw = video.elt.videoWidth, vh = video.elt.videoHeight;
            if (!vw) return;                            // カメラの準備待ち

            // 映像の縦横比を保ったまま、ウィンドウを隙間なく覆うように拡大（以降は映像の座標で描く）
            const s = max(width / vw, height / vh);
            push();
            translate((width - vw * s) / 2, (height - vh * s) / 2);
            scale(s);
            image(video, 0, 0, vw, vh);

            // 陣地の境界線
            stroke(255, 100);
            strokeWeight(2);
            drawingContext.setLineDash([10, 10]);
            line(vw / 2, 0, vw / 2, vh);
            drawingContext.setLineDash([]);

            // 手の骨格（構え中は黄色）
            for (const { h, side } of hands) {
                const armed = players[side].armed;
                stroke(armed ? '#FFD600' : COLORS[side]);
                strokeWeight(3);
                for (const [a, b] of handPose.getConnections()) {
                    line(h.keypoints[a].x, h.keypoints[a].y, h.keypoints[b].x, h.keypoints[b].y);
                }
                noStroke();
                fill(COLORS[side]);
                for (const k of h.keypoints) circle(k.x, k.y, 6);
                if (armed) label('構え', h.wrist.x, h.wrist.y + 40, '#FFD600');
            }

            // 弾丸（尾を引いて飛び、相手の手に当たるか画面外に出たら消える）
            for (const b of bullets) {
                b.pos.add(p5.Vector.mult(b.vel, deltaTime / 1000));
                const target = !winner && hands.find(v => v.side !== b.owner && inHand(v.h, b.pos));
                if (target) {
                    damage(target.side, b.pos);
                    b.dead = true;
                    continue;
                }
                if (b.pos.x < -50 || b.pos.y < -50 || b.pos.x > vw + 50 || b.pos.y > vh + 50) {
                    b.dead = true;
                    continue;
                }
                stroke(COLORS[b.owner]);
                strokeWeight(4);
                line(b.pos.x, b.pos.y, b.pos.x - b.vel.x * 0.05, b.pos.y - b.vel.y * 0.05);
                noStroke();
                fill('#FFF3B0');
                circle(b.pos.x, b.pos.y, 12);
            }
            bullets = bullets.filter(b => !b.dead);

            // マズルフラッシュ（150ms）と被弾エフェクト（400ms）
            for (const e of effects) {
                const k = (millis() - e.t) / (e.type === 'flash' ? 150 : 400);
                if (k >= 1) { e.dead = true; continue; }
                noStroke();
                if (e.type === 'flash') {
                    fill(255, 150, 0, 200 * (1 - k));
                    circle(e.pos.x, e.pos.y, 100 * (1 + k));
                    fill(255, 255, 220, 255 * (1 - k));
                    circle(e.pos.x, e.pos.y, 40 * (1 + k));
                } else {
                    fill(255, 40, 40, 150 * (1 - k));
                    circle(e.pos.x, e.pos.y, 40 + 120 * k);
                    label(`-${DAMAGE}`, e.pos.x, e.pos.y - 30 - 40 * k, '#FF4040');
                }
            }
            effects = effects.filter(e => !e.dead);
            pop();

            drawHud();
        }

        // HPバー・勝敗・状態表示（画面の座標で描く）
        function drawHud() {
            const w = (width - 64) / 2;
            players.forEach((pl, i) => {
                const x = 16 + i * (w + 32);
                textSize(24);
                textAlign(i ? RIGHT : LEFT, TOP);
                stroke(0);
                strokeWeight(3);
                fill(255);
                text(i ? `HP ${pl.hp} P2` : `P1 HP ${pl.hp}`, i ? x + w : x, 16);
                stroke(255);
                strokeWeight(2);
                fill(0, 128);
                rect(x, 48, w, 24, 4);
                noStroke();
                fill(COLORS[i]);
                const bw = w * pl.hp / MAX_HP;
                rect(i ? x + w - bw : x, 48, bw, 24, 4);
            });

            noStroke();
            fill(255);
            textSize(16);
            textAlign(LEFT, BOTTOM);
            text(`手: ${hands.length}`, 16, height - 16);

            if (winner) {
                fill(0, 150);
                rect(0, 0, width, height);
                fill(255);
                textAlign(CENTER, CENTER);
                textSize(48);
                text(winner, width / 2, height / 2 - 20);
                textSize(24);
                text('クリックでもう一度', width / 2, height / 2 + 40);
            }
        }
    </script>
</body>

</html>
