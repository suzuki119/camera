<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>カメラ（p5.js）</title>
    <style>
        html, body { margin: 0; overflow: hidden; background: #000; }
    </style>
    <!-- p5.js 2.x は preload が無く ml5 の読み込み方と合わないので 1.x に固定 -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1.4.0/dist/ml5.min.js"></script>
</head>

<body>
    <!-- ゲームの中身はすべて sketch.js に書いている。
         p5.js が setup() や draw() を自動で見つけて呼ぶので、ここでの呼び出しは不要 -->
    <script src="sketch.js"></script>
</body>

</html>
